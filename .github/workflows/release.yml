# Builds the Windows installer and the Linux package and publishes the release. The Windows installer is not code-signed (see desktop-app/SIGNING.md).
# Needs the repository secrets RECRUIT_DESK_AUTH_URL (the connection code) and TAURI_SIGNING_PRIVATE_KEY (the update key).
# Runs when code is pushed to main (documentation-only pushes are ignored) or when started by hand; never on pull requests.
# A release is published only for a version that has no release yet: raise the version in package.json, tauri.conf.json and Cargo.toml to ship.
name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop-app
    env:
      RECRUIT_DESK_AUTH_URL: ${{ secrets.RECRUIT_DESK_AUTH_URL }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - name: The connection code must be set
        run: test -n "$RECRUIT_DESK_AUTH_URL" || { echo "Secret RECRUIT_DESK_AUTH_URL is not set: the installer would have no sign-in."; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis clang lld llvm libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      # tauri-cli is pinned to the version the installer template was written and tested with. A newer one (2.12.x) generates an installer
      # script that this NSIS (3.09, from apt) cannot compile: "macro RestartManager_StartSession not found".
      - name: Cache cargo tools
        id: cargo-tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-tools-tauri-cli-2.11.4-cargo-xwin-0.23.1
      - name: Tauri CLI and cargo-xwin
        if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.11.4 --locked && cargo install cargo-xwin --version 0.23.1 --locked
      - run: npm ci || npm install
      # The build only needs some update key to finish. The real update key stays in the publish job, which makes the
      # update signature again, so the build job never sees it.
      - name: Throwaway update key for the build
        working-directory: desktop-app/src-tauri
        run: |
          cargo tauri signer generate --ci --password "" --write-keys "$RUNNER_TEMP/throwaway.key"
          echo "TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/throwaway.key" >> "$GITHUB_ENV"
      - name: Windows installer (unsigned)
        working-directory: desktop-app/src-tauri
        run: cargo tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc
      - name: Linux package
        working-directory: desktop-app/src-tauri
        run: cargo tauri build --bundles deb
      - name: Keep the installer for the publish job
        run: |
          mkdir -p ../ci-unsigned
          cp "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/"*-setup.exe ../ci-unsigned/
      - uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: ci-unsigned/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: desktop-app/src-tauri/target/release/bundle/deb/*.deb

  publish:
    needs: build
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: desktop-app
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo tools
        id: cargo-tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-tools-tauri-cli-2.11.4
      - name: Tauri CLI
        if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: The update key must be set
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Secret TAURI_SIGNING_PRIVATE_KEY is not set."; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: installer-unsigned
          path: desktop-app/ci-win
      - uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: desktop-app/ci-linux
      - name: Is this version already released?
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "v=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version $v is already released; nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Put the installer where make-release looks
        if: steps.version.outputs.new == 'true'
        run: |
          v=$(node -p "require('./package.json').version")
          nsis=src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
          deb=src-tauri/target/release/bundle/deb
          mkdir -p "$nsis" "$deb"
          cp ci-win/*.exe "$nsis/Recruit Desk_${v}_x64-setup.exe"
          cp ci-linux/*.deb "$deb/"
          # The build used a throwaway update key, so the update signature is made here with the real one.
          (cd src-tauri && cargo tauri signer sign "../$nsis/Recruit Desk_${v}_x64-setup.exe")
      - name: Release files
        if: steps.version.outputs.new == 'true'
        run: node scripts/make-release.mjs --notes "Recruit Desk ${{ steps.version.outputs.v }}"
      - name: Publish
        if: steps.version.outputs.new == 'true'
        run: gh release create "v${{ steps.version.outputs.v }}" release/* --target "$GITHUB_SHA" --title "Recruit Desk ${{ steps.version.outputs.v }}" --notes "Recruit Desk ${{ steps.version.outputs.v }}"
